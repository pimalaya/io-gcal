name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit

  coverage:
    name: coverage -> codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Measure coverage (cobertura.xml)
        run: cargo tarpaulin --engine llvm --out Xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The live tests mint their own access token, so they need no stored
  # token: GCAL_SERVICE_ACCOUNT_KEY holds the JSON key of a service
  # account, and tests/google.sh trades it for a fresh token per run.
  #
  # Only in this repository: a fork holds no secret, and the job would
  # fail on every contributor's push for want of one.
  google-tests:
    if: github.repository == 'pimalaya/io-gcal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - name: Mint an access token and run the live tests
        env:
          RUST_LOG: trace
          GCAL_SERVICE_ACCOUNT_KEY: ${{ secrets.GCAL_SERVICE_ACCOUNT_KEY }}
        run: |
          printf '%s' "$GCAL_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/gcal-key.json"
          token=$(nix develop -c ./tests/google.sh "$RUNNER_TEMP/gcal-key.json")
          # The token is derived from the secret, so GitHub does not
          # know to mask it; register it before anything can log it.
          echo "::add-mask::$token"
          GCAL_ACCESS_TOKEN="$token" \
            nix develop -c cargo test --features rustls-ring --test google -- --ignored
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/gcal-key.json"
